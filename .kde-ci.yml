Dependencies:
- 'on': ['Linux', 'FreeBSD', 'Windows', 'Android']
  'require':
    'frameworks/extra-cmake-modules': 'Frameworks/6.24'
    'frameworks/ki18n' : 'Frameworks/6.24'
    'frameworks/kcontacts' : 'Frameworks/6.24'
    'frameworks/kcalendarcore' : 'Frameworks/6.24'
    'frameworks/kcodecs' : 'Frameworks/6.24'
    'pim/kmime' : '@same'
    'pim/kpkpass' : '@same'
    'third-party/zxing-cpp': '@latest'

Options:
  # exlucde large generated files from cppcheck, takes way to long to run
  cppcheck-ignore-files:
  - 'src/lib/knowledgedb/trainstationdb.cpp'
  - 'src/lib/knowledgedb/trainstationdb_data.cpp'
  require-passing-tests-on: [ 'Linux', 'FreeBSD' ]
  core-usage-limit: 6
